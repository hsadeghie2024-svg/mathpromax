<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود دانش‌آموز | MathProMax</title>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 60px 20px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #7b1e3a;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #666;
            line-height: 1.8;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #7b1e3a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 10px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ورود دانش‌آموز</h1>

    <p>
        برای ورود به سامانه تعیین سطح، نام کاربری و رمز عبور خود را وارد کنید.
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label for="username">نام کاربری</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <label for="password">رمز عبور</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">
            ورود به سامانه
        </button>

    </form>

</div>

</body>
</html>
